# Builds the prebuilt QEMU that "ppcosx setup" downloads on Linux, for the
# qemu/ commit this repository pins, and attaches it to the release
# "qemu-<first 12 characters of that commit>".
name: Linux QEMU

on:
  push:
    branches: [release/morphos-radeon]
    paths:
      - qemu
      - ppcosx
      - install.sh
      - licenses/**
      - tools/build-linux-qemu.sh
      - .github/workflows/qemu-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/release/morphos-radeon'
    runs-on: ${{ vars.LINUX_X86_64_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config patchelf python3 \
            python3-venv flex bison libglib2.0-dev libpixman-1-dev libslirp-dev \
            libgtk-3-dev libsdl2-dev libepoxy-dev libpulse-dev libvulkan-dev libshaderc-dev \
            libspirv-cross-c-shared-dev

      - name: Build
        run: tools/build-linux-qemu.sh "ppcosx-qemu-linux-x86_64.tar.xz"

      - name: Smoke test
        run: |
          tar -xJf "ppcosx-qemu-linux-x86_64.tar.xz"
          for bin in ppcosx-qemu/bin/*; do
            tags=$(readelf -dW "$bin")
            if grep -Eq '\((RPATH|RUNPATH)\)' <<< "$tags"; then
              echo "$bin contains a library search path" >&2
              exit 1
            fi
          done
          ppcosx-qemu/bin/qemu-system-ppc -device help | grep -q ati-radeon-9700
          ppcosx-qemu/bin/qemu-system-ppc -display help | grep -Eq '^[[:space:]]*sdl([[:space:]]|$)'
          (cd ppcosx-qemu && sha256sum -c SHA256SUMS)
          cmp licenses/SPIRV-Cross-copyright ppcosx-qemu/licenses/SPIRV-Cross-copyright
          cmp licenses/Apache-2.0.txt ppcosx-qemu/licenses/Apache-2.0.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ppcosx-qemu-linux-x86_64
          path: ppcosx-qemu-linux-x86_64.tar.xz
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/morphos-radeon'
    runs-on: ${{ vars.LINUX_X86_64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    concurrency: publish-linux-qemu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ppcosx-qemu-linux-x86_64
      - name: Publish the x86_64 archive at the build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="qemu-$(git rev-parse HEAD:qemu | cut -c1-12)"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "$tag already points to a different bundle commit" >&2
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:refs/tags/$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --latest=false \
              --title "Prebuilt QEMU for Linux ($tag)" \
              --notes "qemu-system-ppc and qemu-img for ppcosx on Linux (Ubuntu 24.04 or newer, x86_64), built from the pinned qemu/ commit."
          gh release upload "$tag" ppcosx-qemu-linux-x86_64.tar.xz --clobber
