name: Linux QEMU

on:
  push:
    branches: [release/morphos-radeon]
    paths:
      - qemu
      - ppcosx
      - install.sh
      - licenses/**
      - tools/morphos-run.sh
      - docs/LINUX-ARCHIVE.md
      - tools/build-linux-qemu.sh
      - .github/workflows/qemu-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/release/morphos-radeon'
    runs-on: ${{ vars.LINUX_X86_64_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config patchelf python3 \
            python3-venv flex bison libglib2.0-dev libpixman-1-dev libslirp-dev \
            libgtk-3-dev libsdl2-dev libepoxy-dev libpulse-dev libvulkan-dev libshaderc-dev \
            libspirv-cross-c-shared-dev

      - name: Build
        run: tools/build-linux-qemu.sh "ppcosx-qemu-linux-x86_64.tar.xz"

      - name: Smoke test
        run: |
          cd "$(mktemp -d)"
          tar -xJf "$GITHUB_WORKSPACE/ppcosx-qemu-linux-x86_64.tar.xz"
          for bin in ppcosx-qemu/bin/*; do
            tags=$(readelf -dW "$bin")
            if grep -Eq '\((RPATH|RUNPATH)\)' <<< "$tags"; then
              echo "$bin contains a library search path" >&2
              exit 1
            fi
          done
          ppcosx-qemu/tools/morphos-run.sh --check
          ppcosx-qemu/bin/qemu-img --version
          test -f ppcosx-qemu/share/pc-bios/keymaps/en-us
          (cd ppcosx-qemu && sha256sum -c SHA256SUMS)
          cmp "$GITHUB_WORKSPACE/licenses/SPIRV-Cross-copyright" ppcosx-qemu/licenses/SPIRV-Cross-copyright
          cmp "$GITHUB_WORKSPACE/licenses/Apache-2.0.txt" ppcosx-qemu/licenses/Apache-2.0.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ppcosx-qemu-linux-x86_64
          path: ppcosx-qemu-linux-x86_64.tar.xz
          if-no-files-found: error
